<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SportPA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f1419;--panel:#1a222c;--panel2:#232d3a;--line:#2e3b4b;--text:#e8eef5;--mute:#8fa1b5;--acc:#4da3ff;--ok:#3ecf8e;--warn:#ffb020;--bad:#ff5a5f;--home:#4da3ff;--away:#ff9f43}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer}
button:active{filter:brightness(1.25)}
button.pri,button.on{background:var(--acc);color:#04121f;border-color:var(--acc);font-weight:600}
button.danger{border-color:var(--bad);color:var(--bad)}
input,textarea,select{font:inherit;color:var(--text);background:#0c1117;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px;width:100%}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
nav button{padding:6px 12px;min-height:40px}
nav .sep{width:1px;background:var(--line);margin:0 4px}
main{padding:12px;max-width:1700px;margin:0 auto}
h2{margin:4px 0 10px;font-size:20px}
h3{margin:0 0 8px;font-size:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.mute{color:var(--mute)}.small{font-size:13px}
.warnbox{background:#3a2d12;border:1px solid var(--warn);color:#ffd98a;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
.okbox{background:#12301f;border:1px solid var(--ok);color:#9bf0c8;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
.badge{display:inline-block;min-width:22px;text-align:center;padding:0 6px;border-radius:6px;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.pill{display:inline-block;padding:0 6px;border-radius:6px;font-size:12px;font-weight:700;margin-right:3px}
.p-g{background:#1f4a35;color:#9bf0c8}.p-f{background:#4a3f1f;color:#ffd98a}.p-p{background:#4a2326;color:#ffb3b6}
.team{display:block;width:100%;text-align:left;margin-bottom:6px}
.pl{display:grid;grid-template-columns:70px auto minmax(110px,1.7fr) minmax(80px,1fr) 44px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.ci{display:grid;grid-template-columns:44px 60px auto minmax(110px,1.7fr) minmax(80px,1fr) 40px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.ci.off{opacity:.45}
.fl{display:flex;gap:4px;flex-wrap:wrap}
.fb{padding:0 6px;min-height:40px;min-width:36px;font-weight:700}
.chk{padding:0;width:40px;height:40px;min-height:40px;font-size:20px}
input.dup{border-color:var(--warn);background:#3a2d12}
.pi{border-bottom:1px solid var(--line);padding:6px 0}
.pi textarea{min-height:56px;margin-top:6px}
.intro{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:10px 14px;margin-bottom:8px;min-height:72px}
.intro .n{font-size:44px;font-weight:800;min-width:90px;text-align:right}
.intro .nm{font-size:32px;font-weight:700;line-height:1.1}
.intro .ph{font-size:18px;color:var(--acc);font-weight:500}
.intro .tgs{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.intro .tgs .badge{font-size:24px;min-width:44px;padding:2px 8px;border-radius:8px}
.intro.done{opacity:.35}
.intro.done .nm{text-decoration:line-through}
.intro .dt{font-size:20px;font-weight:500;color:#c9d6e4;white-space:pre-wrap;margin-top:4px}
.intro.done .dt{display:none}
.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.score{font-size:34px;font-weight:800;display:flex;gap:14px;align-items:center}
.score .h{color:var(--home);font-size:18px;max-width:240px}.score .a{color:var(--away);font-size:18px;max-width:240px}
.play{display:grid;grid-template-columns:1fr 1fr 350px;gap:10px;align-items:start}
.play.norb{grid-template-columns:1fr 1fr 310px}
@media(max-width:1150px){.play,.play.norb{grid-template-columns:1fr 1fr}.play aside{grid-column:1/-1}}
@media(max-width:700px){.play,.play.norb{grid-template-columns:1fr}}
.side{position:sticky;top:58px;max-height:calc(100vh - 70px);overflow:auto;padding-right:2px}
@media(max-width:1150px){.side{position:static;max-height:none}}
.col h3{display:flex;justify-content:space-between}
.col.home h3{color:var(--home)}.col.away h3{color:var(--away)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.pc{display:flex;gap:8px;align-items:center;text-align:left;padding:6px 10px;min-height:68px;border-left-width:5px}
.pc.home{border-left-color:var(--home)}.pc.away{border-left-color:var(--away)}
.pc .n{font-size:30px;font-weight:800;min-width:46px;text-align:center}
.pc .nm{font-size:16px;font-weight:600;line-height:1.1}
.pc .bd{display:block;margin-top:3px}
.pc.fw{background:#3a2d12}
.pc.out{background:#4a2326;border-color:var(--bad)}
.pc.unk{opacity:.8}
.tm{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;margin-bottom:6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.tm .tt{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.tm.warn{background:#4a3a10;border-color:var(--warn);animation:pulse .7s infinite alternate}
.tm.done{background:#5a1d20;border-color:var(--bad);animation:blink .45s infinite alternate}
@keyframes pulse{from{background:#4a3a10}to{background:#8a6410}}
@keyframes blink{from{background:#5a1d20}to{background:#c0282e}}
.clk{width:100%;font-weight:700;font-size:17px}
.clk.run{background:#12301f;border-color:var(--ok)}
.clk.stop{background:#4a2326;border-color:var(--bad)}
.ev{font-size:14px;padding:5px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:6px;align-items:center}
.ev button{min-height:32px;padding:0 8px}
details summary{cursor:pointer;font-weight:600;min-height:32px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:#2b3a4d;border:1px solid var(--acc);border-radius:12px;padding:8px 12px;z-index:60;display:none;gap:12px;align-items:center;max-width:94vw}
#toast.show{display:flex}
.ritem{display:flex;gap:10px;align-items:flex-start;padding:10px;margin-bottom:6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.ritem .rt{font-size:17px;font-weight:600}
.ritem .rd{font-size:15px;color:#c9d6e4;white-space:pre-wrap;margin-top:3px}
.ritem.done{opacity:.4}
.ritem.done .rt{text-decoration:line-through}
.ritem.done .rd{display:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{flex:1;min-height:40px;padding:4px 8px}
nav .brand{align-self:center;margin:0 6px 0 4px;font-size:18px;letter-spacing:.3px}
.navr{margin-left:auto;display:flex;gap:14px;align-items:center}
.now{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.nextbtn{position:fixed;right:18px;bottom:18px;z-index:30;min-height:72px;min-width:200px;font-size:22px;font-weight:700;background:var(--acc);color:#04121f;border-color:var(--acc);box-shadow:0 6px 20px #0009}
#flash{position:fixed;inset:0;pointer-events:none;z-index:45;display:none}
body.alarm-done #flash{display:block;animation:fdone .45s infinite alternate}
body.alarm-warn #flash{display:block;animation:fwarn .8s infinite alternate}
@keyframes fdone{from{background:rgba(255,40,40,.05)}to{background:rgba(255,40,40,.5)}}
@keyframes fwarn{from{background:rgba(255,176,32,0)}to{background:rgba(255,176,32,.22)}}
.sc{display:flex;gap:16px;align-items:flex-start;flex:1;justify-content:center;min-width:0}
.sh{flex:1;min-width:0}
.sn{font-size:36px;font-weight:800;white-space:nowrap}
.tn{font-size:18px;font-weight:700}
.scl{font-size:14px;opacity:.9;margin-top:2px}
.tm.wait{border-color:var(--acc)}
.ev.evlast{font-size:18px;font-weight:700;padding:10px 8px;background:var(--panel2);border-radius:8px;margin-bottom:4px}
.ico{display:block;margin:auto}
.row input{min-width:0}
.brandimg{height:36px;width:36px;border-radius:8px;align-self:center;margin:0 6px 0 2px}
nav button .ico{width:22px;height:22px}
</style>
</head>
<body>
<div id="app"></div>
<div id="flash"></div>
<div id="toast"></div>
<script>
'use strict';
/* ---------- defaults ---------- */
const KEY = 'sportpa-v1', OLD_KEY = 'pa-lineup-v1';
const COLORS = ['#3ecf8e', '#4da3ff', '#ffb020', '#ff5a5f', '#b388ff', '#26c6da'];
const CARD_COLORS = ['#3ecf8e', '#ffd23f', '#ff5a5f', '#4da3ff', '#ffb020', '#e8eef5'];
/* Presets (tags, sports, default schedule, sample teams) live in defaults.json.
   This minimal fallback is only used if that file cannot be loaded (e.g. app opened via file://). */
const FALLBACK = {defaultSport: 'generic', tags: [], plan: {pre: [], brk: [], post: []}, sampleTeams: [],
  sports: [{id: 'generic', name: 'Generic sport', periods: 2, label: 'Half', otLabel: 'OT', score: 'Goal', scoring: true, fouls: false, foulLimit: 3, primary: 'score', keep: false, brkReset: true, goalTypes: [], cards: []}]};
let DEF = FALLBACK, defaultsOK = true;
const PH = [['pre', 'Pre-game'], ['brk', 'Breaks'], ['post', 'Post-game']];
const OLD_SPORT_IDS = {hockey_halle: 'indoor-hockey', hockey_feld: 'field-hockey', wasserball: 'water-polo', volleyball: 'volleyball', basketball: 'basketball'};

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const clone = o => JSON.parse(JSON.stringify(o));
const ICONS = {
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  disk: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  reset: '<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>',
  edit: '<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>',
  play: '<polygon points="5 3 19 12 5 21 5 3"/>'
};
const ico = n => '<svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>';

/* ---------- state ---------- */
function blank() {
  const sp = DEF.sports.find(x => x.id === DEF.defaultSport) || DEF.sports[0];
  return {teams: [], games: [], tags: clone(DEF.tags), sports: clone(DEF.sports).map(normSport), templates: {}, cur: null,
    ui: {view: 'games', team: null, gk: true, side: 'pre', mode: 'goal', card: null, pen: null, gt: '', phase: 'brk', rb: true, evp: false, hold: false, coachFirst: false,
      draft: {sport: sp.id, home: '', away: '', date: today()}}};
}
function mkPlan(spId, S) {
  const t = S.templates[spId], out = {};
  PH.forEach(([k]) => { const src = t ? t[k] : DEF.plan[k].map(x => ({t: x, d: ''})); out[k] = src.map(i => ({id: uid(), t: i.t, d: i.d || ''})); });
  return out;
}
/* Brings a sport definition (old or new format) to the current model */
function normSport(s) {
  if (!Array.isArray(s.cards)) {
    const pen = Array.isArray(s.pen) ? s.pen : [];
    s.cards = pen.length ? [{id: 'pen', name: 'Penalty', c: 2, durs: pen.slice(), outAt: 0}] : [];
  }
  delete s.pen;
  s.cards.forEach(c => { if (!c.id) c.id = uid(); if (!Array.isArray(c.durs)) c.durs = []; c.outAt = Math.max(0, parseInt(c.outAt, 10) || 0); c.c = (c.c || 0) % CARD_COLORS.length; });
  if (s.otLabel == null) s.otLabel = 'OT';
  if (s.scoring == null) s.scoring = true;
  s.fouls = !!s.fouls; s.foulLimit = Math.max(1, parseInt(s.foulLimit, 10) || 3);
  if (s.primary !== 'foul') s.primary = 'score';
  if (!Array.isArray(s.goalTypes)) s.goalTypes = [];
  return s;
}
const toArr = f => Array.isArray(f) ? f : String(f || '').split('').filter(Boolean);
function migrate(S) {
  if (!S.tags) S.tags = clone(DEF.tags);
  if (!S.sports) S.sports = clone(DEF.sports);
  S.sports.forEach(normSport);
  if (!S.templates) S.templates = {};
  const sid = id => OLD_SPORT_IDS[id] || id;
  S.teams.forEach(t => t.players.forEach(p => { p.f = toArr(p.f); }));
  S.games.forEach(g => {
    g.clk = false;
    ['home', 'away'].forEach(s => g.roster[s].forEach(e => { e.f = toArr(e.f); }));
    g.sport = sid(g.sport);
    if (!g.sp) g.sp = clone(S.sports.find(x => x.id === g.sport) || S.sports[0]);
    normSport(g.sp);
    if (!g.plan) g.plan = mkPlan(g.sport, S);
    if (g.ref == null) g.ref = '';
  });
  const d = S.ui.draft; d.sport = sid(d.sport);
  if (!S.sports.find(x => x.id === d.sport)) d.sport = S.sports[0].id;
  if (!['pre', 'ref', 'away', 'home'].includes(S.ui.side)) S.ui.side = 'pre';
  if (!['brk', 'post'].includes(S.ui.phase)) S.ui.phase = 'brk';
  if (S.ui.rb == null) S.ui.rb = true;
  if (S.ui.evp == null) S.ui.evp = false;
  if (S.ui.hold == null) S.ui.hold = false;
  if (S.ui.coachFirst == null) S.ui.coachFirst = false;
  if (S.ui.card === undefined) S.ui.card = null;
  if (S.ui.gt == null) S.ui.gt = '';
  return S;
}
let storageOK = true;
function load() {
  const b = blank();
  try {
    const r = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY);
    if (r) { const o = JSON.parse(r); return migrate(Object.assign(b, o, {ui: Object.assign(b.ui, o.ui || {})})); }
  } catch (e) { storageOK = false; }
  return b;
}
let S = null; /* set in boot() once defaults.json is loaded */
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOK = false; } }
const cur = () => (S && S.games.find(g => g.id === S.cur)) || null;
const team = () => S.teams.find(t => t.id === S.ui.team) || null;
const spOf = g => g.sp || S.sports[0];
/* period text: regular periods as "Quarter 2/4", beyond the last one as overtime "OT1", "OT2" ... */
const perTxt = (sp, p) => p <= sp.periods ? sp.label + ' ' + p + '/' + sp.periods : sp.otLabel + (p - sp.periods);
const perShort = (sp, p) => p <= sp.periods ? p + '/' + sp.periods : sp.otLabel + (p - sp.periods);
/* entry modes a sport offers; baseMode is the one the app returns to (the sport's primary record type) */
const modesOf = sp => [sp.scoring && 'goal', sp.fouls && 'foul', sp.cards.length && 'pen'].filter(Boolean);
const baseMode = sp => { const m = modesOf(sp); return m.includes(sp.primary === 'foul' ? 'foul' : 'goal') ? (sp.primary === 'foul' ? 'foul' : 'goal') : (m[0] || null); };
const cardOf = (sp, id) => sp.cards.find(c => c.id === id) || null;
const cardCol = c => CARD_COLORS[(c.c || 0) % CARD_COLORS.length];
const cardCnt = (g, id, cardId) => g.ev.filter(e => e.t === 'pen' && e.e === id && (e.c || '') === cardId).length;
/* Why a player is excluded (foul limit or a card with an exclusion threshold), '' if not */
function outWhy(g, sp, id) {
  if (id === '?') return '';
  if (sp.fouls && cnt(g, id, 'foul') >= sp.foulLimit) return 'Foul ' + sp.foulLimit;
  const c = sp.cards.find(x => x.outAt > 0 && cardCnt(g, id, x.id) >= x.outAt);
  return c ? c.name : '';
}

/* ---------- helpers ---------- */
const tagOf = c => S.tags.find(t => t.code === c);
const tagCol = c => COLORS[(tagOf(c) ? tagOf(c).c : 5) % COLORS.length];
function normF(arr) {
  const u = [...new Set(arr)], codes = S.tags.map(t => t.code);
  return u.sort((a, b) => { const ia = codes.indexOf(a), ib = codes.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
}
const toggleF = (arr, c) => normF(arr.includes(c) ? arr.filter(x => x !== c) : arr.concat(c));
function badge(c) { const col = tagCol(c); return '<span class="badge" title="' + esc(tagOf(c) ? tagOf(c).label : c) + '" style="background:' + col + '33;border-color:' + col + ';color:' + col + '">' + esc(c) + '</span>'; }
function tagBtn(c, on, attrs) {
  const col = tagCol(c);
  return '<button class="fb" title="' + esc(tagOf(c) ? tagOf(c).label : c) + '" style="' + (on ? 'background:' + col + ';border-color:' + col + ';color:#04121f' : 'border-color:' + col + ';color:' + col) + '" ' + attrs + '>' + esc(c) + '</button>';
}
const numOf = e => (e.n === '' || e.n == null || isNaN(parseInt(e.n, 10))) ? 1e9 : parseInt(e.n, 10);
function ordered(list) {
  const top = e => (S.ui.gk && e.f.some(c => tagOf(c) && tagOf(c).top)) ? 0 : 1;
  return [...list].sort((a, b) => (top(a) - top(b)) || (numOf(a) - numOf(b)) || a.name.localeCompare(b.name));
}
function dupSet(list) {
  const c = {}; list.filter(e => e.on !== false && e.n).forEach(e => { c[e.n] = (c[e.n] || 0) + 1; });
  return new Set(Object.keys(c).filter(k => c[k] > 1));
}
const lastName = n => { const p = String(n).trim().split(/\s+/); return p[p.length - 1] || ''; };
const fmtDur = s => s >= 60 ? (s / 60) + ' min' : s + ' s';
const fmtT = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
/* Starts waiting penalty timers (all, or only one) and moves the linked penalty event to the actual start time */
function startWaiting(g, onlyId) {
  const now = Date.now();
  g.tm.forEach(t => {
    if (t.st !== 'wait' || (onlyId && t.id !== onlyId)) return;
    t.st = 'run';
    const e = g.ev.find(x => x.tm === t.id); if (e) e.ts = now;
  });
}
const hms = ts => { const d = new Date(ts); return [d.getHours(), d.getMinutes(), d.getSeconds()].map(x => String(x).padStart(2, '0')).join(':'); };

/* ---------- roster parser ---------- */
function parseRoster(text) {
  const codes = S.tags.map(t => t.code);
  const raw = [];
  for (const line of text.split(/\r?\n/)) for (const c of line.split('\t')) {
    const t = c.replace(/ /g, ' ').replace(/\s+/g, ' ').trim(); if (t) raw.push(t);
  }
  const tk = [];
  for (const t of raw) {
    let r = t, m = r.match(/^(\d{1,3})\s+(.+)$/);
    if (m) { tk.push(m[1]); r = m[2]; }
    while ((m = r.match(/^(\S+)\s+(.+)$/)) && codes.includes(m[1])) { tk.push(m[1]); r = m[2]; }
    tk.push(r);
  }
  const isNum = t => /^\d{1,3}$/.test(t);
  const isFl = t => { const p = t.split(/[\s,\/]+/).filter(Boolean); return p.length > 0 && p.every(x => codes.includes(x)); };
  let teamName = '', mode = 'p', pn = null, pf = [];
  const players = [], staff = [], warn = [];
  for (let i = 0; i < tk.length; i++) {
    const t = tk[i], nxt = tk[i + 1];
    if (/^(trainer|coach|coaches|staff|betreuer)s?:?$/i.test(t)) { mode = 's'; pn = null; pf = []; continue; }
    if (isNum(t)) { mode = 'p'; pn = t; continue; }
    if (isFl(t)) { pf = pf.concat(t.split(/[\s,\/]+/).filter(Boolean)); continue; }
    if (mode === 's') {
      if (nxt && isNum(nxt)) {
        if (t.toLowerCase() === teamName.toLowerCase()) { mode = 'p'; continue; }
        warn.push('Another team block "' + t + '" was ignored'); break;
      }
      staff.push(t); continue;
    }
    if (!players.length && pn === null && !teamName && nxt && isNum(nxt)) { teamName = t; continue; }
    if (teamName && pn === null && t.toLowerCase() === teamName.toLowerCase() && nxt && isNum(nxt)) continue;
    players.push({name: t, n: pn || '', f: pf}); pn = null; pf = [];
  }
  const seen = new Map(), out = []; let removed = 0;
  for (const p of players) {
    p.f = normF(p.f);
    const k = p.n + '|' + p.name.toLowerCase();
    if (seen.has(k)) { removed++; const q = seen.get(k); q.f = normF(q.f.concat(p.f)); continue; }
    seen.set(k, p); out.push(p);
  }
  const cn = {}, cm = {};
  out.forEach(p => { if (p.n) cn[p.n] = (cn[p.n] || 0) + 1; cm[p.name.toLowerCase()] = (cm[p.name.toLowerCase()] || 0) + 1; });
  const dn = Object.keys(cn).filter(k => cn[k] > 1), dm = out.filter(p => cm[p.name.toLowerCase()] > 1).map(p => p.name);
  if (dn.length) warn.push('Duplicate numbers: ' + dn.join(', '));
  if (dm.length) warn.push('Duplicate names: ' + [...new Set(dm)].join(', '));
  const nn = out.filter(p => !p.n).length; if (nn) warn.push(nn + ' without number');
  if (removed) warn.push(removed + ' repeated entries removed');
  return {team: teamName, players: out, staff: [...new Set(staff)], warn};
}

  /* plan */
  'p-add'(el) { cur().plan[el.dataset.ph].push({id: uid(), t: '', d: ''}); save(); render(); },
  'p-del'(el) { const g = cur(); g.plan[el.dataset.ph] = g.plan[el.dataset.ph].filter(i => i.id !== el.dataset.id); save(); render(); },
  'p-up'(el) { const a = cur().plan[el.dataset.ph], i = a.findIndex(x => x.id === el.dataset.id); if (i > 0) { [a[i - 1], a[i]] = [a[i], a[i - 1]]; save(); render(); } },
  'p-down'(el) { const a = cur().plan[el.dataset.ph], i = a.findIndex(x => x.id === el.dataset.id); if (i < a.length - 1) { [a[i + 1], a[i]] = [a[i], a[i + 1]]; save(); render(); } },
  'p-tpl'() { const g = cur(); S.templates[g.sport] = clone(g.plan); save(); toast('Saved as template for ' + spOf(g).name); },
  'p-qadd'() { const g = cur(), v = $('#qa').value.trim(); if (!v) return; g.plan[S.ui.phase].push({id: uid(), t: v, d: ''}); save(); render(); },
  phase(el) { S.ui.phase = el.dataset.p; save(); render(); },
  rchk(el) { const g = cur(), k = rKey(g, S.ui.phase, el.dataset.id); g.chk[k] = !g.chk[k]; save(); render(); },
  rreset() { const g = cur(), ph = S.ui.phase; g.plan[ph].forEach(i => { delete g.chk[rKey(g, ph, i.id)]; }); save(); render(); },
  rbtoggle() { S.ui.rb = !S.ui.rb; save(); render(); },
  /* check-in */
  'ci-on'(el) { const e = findE(cur(), el.dataset.side, el.dataset.id); e.on = !e.on; save(); render(); },
  'ci-flag'(el) { const e = findE(cur(), el.dataset.side, el.dataset.id); e.f = toggleF(e.f, el.dataset.f); save(); render(); },
  'ci-del'(el) { const g = cur(); g.roster[el.dataset.side] = g.roster[el.dataset.side].filter(e => e.id !== el.dataset.id); save(); render(); },
  'ci-add'(el) { cur().roster[el.dataset.side].push({id: uid(), tp: null, name: '', n: '', f: [], ph: '', on: true}); save(); render(); },
  'ci-sort'(el) { const g = cur(); g.roster[el.dataset.side] = ordered(g.roster[el.dataset.side]); save(); render(); },
  'ci-save'(el) {
    const g = cur(), side = el.dataset.side, t = S.teams.find(x => x.id === g[side].tid); if (!t) return;
    g.roster[side].forEach(e => { const p = t.players.find(x => x.id === e.tp); if (p) { p.n = e.n; p.ph = e.ph; p.f = e.f.slice(); } });
    save(); toast('Numbers saved to team');
  },
  /* lineups */
  iside(el) { S.ui.side = el.dataset.side; save(); render(); },
  gk() { S.ui.gk = !S.ui.gk; save(); render(); },
  ann(el) { const g = cur(); g.ann[el.dataset.id] = !g.ann[el.dataset.id]; save(); render(); },
  annreset() { cur().ann = {}; save(); render(); },
  'ann-next'() {
    const g = cur(), order = ['pre', 'ref', 'away', 'home'], names = {pre: 'Pre-game', ref: 'Officials', away: 'Away team', home: 'Home team'};
    const open = sd => introIds(g, sd).find(x => !g.ann[x]);
    const nextTab = from => { const k = order.indexOf(from); for (let n = 1; n < order.length; n++) { const sd = order[(k + n) % order.length]; if (open(sd)) return sd; } return null; };
    const goGame = () => { S.ui.view = 'play'; if (S.ui.phase === 'pre') S.ui.phase = 'brk'; S.ui.mode = baseMode(spOf(g)); S.ui.gt = ''; save(); render(); window.scrollTo(0, 0); toast('Intro done: game on'); };
    const jump = sd => { S.ui.side = sd; save(); render(); window.scrollTo({top: 0, behavior: 'smooth'}); toast('Next: ' + names[sd]); };
    const side = S.ui.side, id = open(side);
    if (!id) { const sd = nextTab(side); if (sd) jump(sd); else goGame(); return; }
    g.ann[id] = true; save(); render();
    if (!open(side)) { const sd = nextTab(side); if (sd) jump(sd); else goGame(); return; }
    const nx = document.querySelector('.intro:not(.done)');
    if (nx) window.scrollTo({top: Math.max(0, nx.getBoundingClientRect().top + window.scrollY - 150), behavior: 'smooth'});
  },
  coachfirst() { S.ui.coachFirst = !S.ui.coachFirst; save(); render(); },
  evtoggle() { S.ui.evp = !S.ui.evp; save(); render(); },
  /* game */
  mode(el) { S.ui.mode = el.dataset.m; save(); render(); },
  pdur(el) { S.ui.pen = parseInt(el.dataset.d, 10); save(); render(); },
  pcard(el) { S.ui.card = el.dataset.id; save(); render(); },
  gtype(el) { S.ui.gt = el.dataset.t; save(); render(); },
  per(el) { const g = cur(); g.per = Math.max(1, Math.min(99, g.per + parseInt(el.dataset.d, 10))); save(); render(); },
  clk() { const g = cur(); g.clk = !g.clk; if (g.clk) startWaiting(g); lastTick = performance.now(); save(); render(); },
  'tm-start'(el) {
    const g = cur(), t = g.tm.find(x => x.id === el.dataset.id); if (!t) return;
    if (!g.clk) { g.clk = true; startWaiting(g); } else startWaiting(g, t.id);
    lastTick = performance.now(); save(); render();
  },
  tap(el) {
    const g = cur(), sp = spOf(g), side = el.dataset.side, id = el.dataset.id, mode = S.ui.mode;
    if (!mode) return;
    const ent = id === '?' ? {n: '?', name: 'Unknown'} : findE(g, side, id);
    const nm = (ent.n ? '#' + ent.n + ' ' : '') + ent.name, sd = side === 'home' ? 'Home' : 'Away';
    if (mode === 'goal') {
      const k = sp.goalTypes.includes(S.ui.gt) ? S.ui.gt : '', e = {id: uid(), ts: Date.now(), p: g.per, s: side, e: id, t: 'goal'};
      if (k) e.k = k;
      g.ev.push(e); S.ui.gt = '';
      toast(sp.score + (k ? ' · ' + k : '') + ' ' + sd + ': ' + nm + ' (' + score(g, 'home') + ':' + score(g, 'away') + ')', true);
    } else if (mode === 'foul') {
      if (id === '?') return;
      g.ev.push({id: uid(), ts: Date.now(), p: g.per, s: side, e: id, t: 'foul'});
      toast('Foul ' + sd + ': ' + nm + ' (' + cnt(g, id, 'foul') + '/' + sp.foulLimit + ')' + (cnt(g, id, 'foul') >= sp.foulLimit ? ' OUT' : ''), true);
    } else if (mode === 'pen') {
      const c = cardOf(sp, S.ui.card) || sp.cards[0], dur = c.durs.includes(S.ui.pen) ? S.ui.pen : (c.durs[0] || 0), tid = dur ? uid() : null;
      if (tid) g.tm.push({id: tid, side, label: id === '?' ? '?' : (ent.n ? '#' + ent.n + ' ' : '') + lastName(ent.name), cn: c.name, dur: dur * 1000, rem: dur * 1000, st: 'wait'});
      const e = {id: uid(), ts: Date.now(), p: g.per, s: side, e: id, t: 'pen', c: c.id, cn: c.name, d: dur};
      if (tid) e.tm = tid;
      g.ev.push(e);
      toast(c.name + (dur ? ' ' + fmtDur(dur) : '') + ' ' + sd + ': ' + nm + (outWhy(g, sp, id) ? ' OUT' : '') + (dur ? ' (starts when play resumes)' : ''), true);
    }
    if (mode !== baseMode(sp) && !sp.keep) S.ui.mode = baseMode(sp);
    save(); render();
  },
  undo() { const g = cur(); const e = g.ev.pop(); if (e && e.tm) g.tm = g.tm.filter(t => t.id !== e.tm); $('#toast').className = ''; save(); render(); },
  evdel(el) { const g = cur(); const e = g.ev.find(x => x.id === el.dataset.id); if (e && e.tm) g.tm = g.tm.filter(t => t.id !== e.tm); g.ev = g.ev.filter(x => x.id !== el.dataset.id); save(); render(); },
  tmx(el) { const g = cur(); g.tm = g.tm.filter(t => t.id !== el.dataset.id); if (!g.tm.some(t => t.st === 'run')) g.clk = false; save(); render(); },
  /* data */
  exp() { const b = new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'sportpa-backup-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove(); },
  async expcopy() { try { await navigator.clipboard.writeText(JSON.stringify(S)); toast('Copied'); } catch (e) { toast('Copy not possible'); } },
  impdata(el) { if (!arm(el)) return; importJson($('#impdata').value); },
  sample() {
    if (!DEF.sampleTeams.length) { toast('No sample teams in defaults.json'); return; }
    DEF.sampleTeams.forEach(t => S.teams.push({id: uid(), name: t.name, staff: t.staff || '', players: t.players.map(p => ({id: uid(), name: p.name, n: p.n || '', f: toArr(p.f), ph: p.ph || ''}))}));
    save(); render(); toast('Sample teams added');
  },
  wipe(el) { if (!arm(el)) return; S = blank(); save(); render(); }
};
function importJson(txt) {
  try {
    const o = JSON.parse(txt); if (!o || !Array.isArray(o.teams) || !Array.isArray(o.games)) throw new Error('format');
    const b = blank(); S = migrate(Object.assign(b, o, {ui: Object.assign(b.ui, o.ui || {})}));
    save(); dataMsg = '<div class="okbox">Import successful.</div>'; render(); setTimeout(() => { dataMsg = ''; if (S.ui.view === 'data') render(); }, 4000);
  } catch (e) { dataMsg = '<div class="warnbox">Import failed: not a valid backup.</div>'; render(); }
}

/* ---------- inputs ---------- */
const inps = {
  draft(el) { S.ui.draft[el.dataset.k] = el.value; },
  tf(el) { team()[el.dataset.k] = el.value; },
  tp(el) { team().players.find(p => p.id === el.dataset.id)[el.dataset.k] = el.value; },
  'ci-f'(el) { findE(cur(), el.dataset.side, el.dataset.id)[el.dataset.k] = el.value; },
  g(el) { cur()[el.dataset.k] = el.value; },
  gs(el) { cur()[el.dataset.side].staff = el.value; },
  pi(el) { planItem(cur(), el.dataset.ph, el.dataset.id)[el.dataset.k] = el.value; },
  tag(el) { S.tags[+el.dataset.i][el.dataset.k] = el.value.trim(); },
  sp(el) {
    const s = S.sports.find(x => x.id === el.dataset.id), k = el.dataset.k, v = el.value;
    if (k === 'periods' || k === 'foulLimit') s[k] = Math.max(1, parseInt(v, 10) || 1);
    else if (k === 'goalTypes') s.goalTypes = [...new Set(v.split(',').map(x => x.trim()).filter(Boolean))];
    else s[k] = v;
  },
  card(el) {
    const c = S.sports.find(x => x.id === el.dataset.id).cards.find(x => x.id === el.dataset.cid), k = el.dataset.k, v = el.value;
    if (k === 'durs') c.durs = [...new Set(v.split(/[,\s]+/).map(x => parseInt(x, 10)).filter(x => x > 0))];
    else if (k === 'outAt') c.outAt = Math.max(0, parseInt(v, 10) || 0);
    else c[k] = v;
  }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && acts[el.dataset.act]) acts[el.dataset.act](el, e); });
document.addEventListener('input', e => { const el = e.target, h = el.dataset && el.dataset.inp; if (h && inps[h]) { inps[h](el); save(); } });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'impfile' && el.files[0]) { el.files[0].text().then(importJson); return; }
  if (el.dataset && el.dataset.inp === 'draft') { inps.draft(el); save(); return; }
  if (el.dataset && el.dataset.rr) render();
});

/* ---------- timer loop ---------- */
let lastTick = performance.now();
function updateNow() { const el = $('#now'); if (el) { const t = hms(Date.now()); if (el.textContent !== t) el.textContent = t; } }
function updateAlarm() {
  const g = cur(); let st = '';
  if (g) { if (g.tm.some(t => t.st === 'done')) st = 'done'; else if (g.clk && g.tm.some(t => t.st === 'run' && tmClass(t) === 'warn')) st = 'warn'; }
  const c = st ? 'alarm-' + st : ''; if (document.body.className !== c) document.body.className = c;
}
setInterval(() => {
  const now = performance.now(), dt = Math.min(now - lastTick, 2000); lastTick = now;
  updateNow();
  const g = cur();
  if (g && g.clk) {
    let changed = false; const had = g.tm.some(t => t.st === 'run');
    g.tm.forEach(t => {
      if (t.st !== 'run') return;
      t.rem -= dt; const fin = t.rem <= 0; if (fin) { t.rem = 0; t.st = 'done'; changed = true; }
      const el = document.querySelector('[data-tid="' + t.id + '"]');
      if (el) { el.className = 'tm ' + tmClass(t); el.querySelector('.tt').textContent = fmtT(t.rem); if (fin) { el.firstElementChild.innerHTML = tmLabel(t); el.querySelector('.tmb').innerHTML = tmBtns(t); } }
    });
    if (had && !g.tm.some(t => t.st === 'run')) {
      g.clk = false; changed = true;
      const b = document.querySelector('.clk'); if (b) { b.className = 'clk stop'; b.textContent = 'Play stopped (tap when play resumes)'; }
    }
    if (changed) save();
  }
  updateAlarm();
}, 250);

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* ignore */ } }
async function boot() {
  try {
    const r = await fetch('defaults.json', {cache: 'no-cache'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!d || !Array.isArray(d.sports) || !d.sports.length || !Array.isArray(d.tags) || !d.plan) throw new Error('format');
    d.sampleTeams = Array.isArray(d.sampleTeams) ? d.sampleTeams : [];
    DEF = d;
  } catch (e) { defaultsOK = false; }
  S = load(); render();
  if (!defaultsOK) toast('defaults.json could not be loaded, using minimal built-in defaults');
}
boot();
</script>
</body>
